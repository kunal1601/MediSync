version: 0.2

phases:
  pre_build:
    commands:
      - echo Logging in to Amazon ECR...
      - aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin 055855671058.dkr.ecr.ap-south-1.amazonaws.com
      - IMAGE_TAG=$CODEBUILD_RESOLVED_SOURCE_VERSION
      - echo Image tag: $IMAGE_TAG

  build:
    commands:
      - echo Building Docker image...
      - docker build -t medisync-backend ./Project/medisync-backend
      - docker tag medisync-backend:latest 055855671058.dkr.ecr.ap-south-1.amazonaws.com/medisync/backend:$IMAGE_TAG

  post_build:
    commands:
      - echo Pushing Docker image to ECR...
      - docker push 055855671058.dkr.ecr.ap-south-1.amazonaws.com/medisync/backend:$IMAGE_TAG
      - echo Docker image pushed successfully.

artifacts:
  files:
    - '**/*'
